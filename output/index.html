<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>悪態独り</title>
<meta name="theme-color" content="#0a0b1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --ink:#e8f0ff; --edge:#05060f; --mag:#ff2e88; }
  html, body {
    margin: 0; height: 100%; background: #05060f; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 16:9 を保って中央配置。縦長でも伸ばさない */
  canvas {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: pixelated; touch-action: none;
  }
  @supports (height: 100dvh) {
    canvas { width: min(100vw, calc(100dvh * 16 / 9)); height: min(100dvh, calc(100vw * 9 / 16)); }
  }
  /* 文字は画面解像度の HTML オーバーレイ */
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: 'DotGothic16', 'BIZ UDPGothic', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    color: var(--ink);
    text-shadow: 0 0 2px var(--edge), 1px 1px 0 var(--edge), -1px -1px 0 var(--edge), 1px -1px 0 var(--edge), -1px 1px 0 var(--edge);
  }
  #debug { position: absolute; left: 12px; top: 10px; font-size: 14px; opacity: .85; white-space: pre; }
  #scene-name { position: absolute; left: 0; right: 0; top: 6vh; text-align: center; font-size: clamp(20px, 4vw, 44px); letter-spacing: .2em; }
  #mono { position: absolute; left: 0; right: 0; top: 16vh; text-align: center; font-size: clamp(14px, 2.2vw, 24px); opacity: 0; transition: opacity .6s; }
  #recall { position: absolute; left: 8vw; right: 8vw; top: 50%; transform: translateY(-50%); font-size: clamp(18px, 3vw, 32px); line-height: 1.9; text-align: left; }
  #recall .ln::before { content: "─ "; }
  #shout {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap;
    font-size: clamp(48px, 13vw, 160px); color: #fff; -webkit-text-stroke: .08em var(--mag); paint-order: stroke fill;
    text-shadow: none; opacity: 0; letter-spacing: .05em;
  }
  #shout.on { opacity: 1; animation: shake .09s infinite; }
  @keyframes shake {
    0%   { transform: translate(-50%,-50%) translate(-3px, 2px); }
    50%  { transform: translate(-50%,-50%) translate(3px, -2px); }
    100% { transform: translate(-50%,-50%) translate(-2px, -3px); }
  }
  #judge { position: absolute; left: 0; right: 0; bottom: 24vh; text-align: center; font-size: clamp(20px, 4vw, 44px); opacity: 0; }
  #meter { position: absolute; left: 4vw; right: 4vw; bottom: 3vh; height: 1.2vh; background: rgba(5,6,15,.6); border: 1px solid var(--ink); display: none; }
  #meter i { display: block; height: 100%; width: 0; background: var(--mag); }
  #ending { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; }
  #ending .big { font-size: clamp(22px, 4vw, 44px); }
  #ending .small { font-size: clamp(12px, 1.8vw, 18px); opacity: .8; }
  #hint { position: absolute; left: 0; right: 0; bottom: 8vh; text-align: center; font-size: clamp(13px, 1.8vw, 18px); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,60%,100% { opacity: .9; } 80% { opacity: .3; } }
  #rotate { display: none; }
  @media (orientation: portrait) {
    #rotate { display: block; position: absolute; left: 0; right: 0; bottom: 3vh; text-align: center; font-size: 15px; opacity: .9; }
    #hint { bottom: 12vh; }
  }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<div id="ui">
  <div id="debug"></div>
  <div id="scene-name"></div>
  <div id="mono"></div>
  <div id="recall"></div>
  <div id="shout"></div>
  <div id="judge"></div>
  <div id="meter"><i></i></div>
  <div id="ending"><div class="big" id="end-line"></div><div class="small" id="end-stats"></div><div class="small" id="end-again"></div></div>
  <div id="hint"></div>
  <div id="rotate">横向きにすると大きく遊べます</div>
</div>
<!-- クラシック script（ES modules は file:// で動かないため使わない）。読み込み順固定 -->
<script src="data/texts.js"></script>
<script src="data/rounds.js"></script>
<script src="src/core.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/songs.js"></script>
<script src="src/rhythm.js"></script>
<script src="src/art.js"></script>
<script src="src/ui.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body>
</html>
