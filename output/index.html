<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>悪態独り</title>
<meta name="theme-color" content="#0a0b1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --ink:#e8f0ff; --edge:#05060f; --mag:#ff2e88; --accent:#ff2e88; --bw: min(100vw, calc(100vh * 16 / 9)); --bh: min(100vh, calc(100vw * 9 / 16)); }
  @supports (height: 100dvh) {
    :root { --bw: min(100vw, calc(100dvh * 16 / 9)); --bh: min(100dvh, calc(100vw * 9 / 16)); }
  }
  html, body {
    margin: 0; height: 100%; background: #05060f; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 16:9 を保って中央配置。縦長でも伸ばさない。#ui も同じ箱に重ねる（% 指定がキャンバス座標に対応する） */
  canvas, #ui {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: var(--bw); height: var(--bh);
  }
  canvas { image-rendering: pixelated; touch-action: none; }
  /* 文字は画面解像度の HTML オーバーレイ。サイズは箱の幅(--bw)基準 */
  #ui {
    pointer-events: none; overflow: hidden;
    font-family: 'DotGothic16', 'BIZ UDPGothic', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    color: var(--ink); font-size: calc(var(--bw) * 0.022);
    text-shadow: 0 0 2px var(--edge), 1px 1px 0 var(--edge), -1px -1px 0 var(--edge), 1px -1px 0 var(--edge), -1px 1px 0 var(--edge);
  }
  #debug { position: absolute; left: 1%; top: 1%; font-size: 12px; opacity: .85; white-space: pre; }
  #scene-name { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font-size: calc(var(--bw) * 0.09); letter-spacing: .25em;
    color: #fff; -webkit-text-stroke: .06em var(--mag); paint-order: stroke fill; text-shadow: 0 .05em 0 var(--edge); }
  #scene-name .sub { display: block; font-size: .22em; letter-spacing: .3em; margin-top: .6em; -webkit-text-stroke: 0; color: var(--ink);
    text-shadow: 0 0 2px var(--edge), 1px 1px 0 var(--edge), -1px -1px 0 var(--edge), 1px -1px 0 var(--edge), -1px 1px 0 var(--edge); }
  /* 独り言: 主人公の頭上（left/top は scenes から指定） */
  #mono { position: absolute; left: 25%; top: 62%; transform: translate(-30%, -100%); white-space: nowrap; font-size: calc(var(--bw) * 0.024);
    opacity: 0; transition: opacity .8s; padding: .2em .6em; background: rgba(5,6,15,.45); border-radius: .3em; }
  #recall { position: absolute; left: 10%; right: 8%; top: 50%; transform: translateY(-50%); font-size: calc(var(--bw) * 0.03); line-height: 1.85; text-align: left; }
  #recall .ln::before { content: "─ "; opacity: .7; }
  #recall .ln { opacity: .55; }
  #recall .ln:last-child { opacity: 1; }
  #shout {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap;
    font-size: calc(var(--bw) * 0.11); color: #fff; -webkit-text-stroke: .08em var(--mag); paint-order: stroke fill;
    text-shadow: none; opacity: 0; letter-spacing: .05em;
  }
  #shout.long { font-size: calc(var(--bw) * 0.075); }
  #shout.on { opacity: 1; animation: shake .09s infinite; }
  @keyframes shake {
    0%   { transform: translate(-50%,-50%) translate(-3px, 2px); }
    50%  { transform: translate(-50%,-50%) translate(3px, -2px); }
    100% { transform: translate(-50%,-50%) translate(-2px, -3px); }
  }
  /* 判定文字（レーンの判定線の上） */
  #judge { position: absolute; left: 44%; top: 70%; transform: translate(-50%, -50%); font-size: calc(var(--bw) * 0.045); opacity: 0; white-space: nowrap;
    color: #fff; -webkit-text-stroke: .07em var(--edge); paint-order: stroke fill; text-shadow: none; letter-spacing: .05em; }
  #judge.perfect, #judge.just { color: #fff; -webkit-text-stroke-color: var(--mag); }
  #judge.crash { color: #ff5a6e; }
  #judge.good { color: var(--accent); }
  #judge.miss { color: #8a93b8; }
  #judge.pop { animation: pop .45s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1.35); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
  }
  #combo { position: absolute; left: 44%; top: 60%; transform: translate(-50%, -50%); font-size: calc(var(--bw) * 0.022); opacity: 0; white-space: nowrap; }
  /* 速度メーター（上部） */
  #meter { position: absolute; left: 14%; right: 4%; top: 4%; height: 2.4%; background: rgba(5,6,15,.65); border: 1px solid var(--ink); display: none; }
  #meter i { display: block; height: 100%; width: 0; background: var(--mag); box-shadow: 0 0 6px var(--mag); }
  #meter b { position: absolute; right: 100%; top: 50%; transform: translateY(-50%); margin-right: .6em; font-weight: normal; font-size: calc(var(--bw) * 0.02); white-space: nowrap; }
  #meter.max i { background: #fff; box-shadow: 0 0 10px #fff; }
  #ending { position: absolute; left: 2%; right: 56%; top: 5%; display: none; flex-direction: column; align-items: center; gap: .9em; text-align: center; }
  #ending .rank { font-size: calc(var(--bw) * 0.07); color: #fff; -webkit-text-stroke: .07em var(--mag); paint-order: stroke fill; text-shadow: none; line-height: 1; }
  #ending .big { font-size: calc(var(--bw) * 0.028); line-height: 1.6; padding: .3em .6em; background: rgba(5,6,15,.55); border-radius: .3em; }
  #ending .small { font-size: calc(var(--bw) * 0.017); opacity: .9; white-space: pre-line; line-height: 1.6; background: rgba(5,6,15,.45); padding: .2em .6em; border-radius: .3em; }
  /* 呑まれたとき: 真っ黒な画面に大きな一言(.big) / ゲームオーバーの結末文(.end) */
  #doom { position: absolute; left: 6%; right: 6%; top: 50%; transform: translateY(-50%); text-align: center; display: none; }
  #doom.on { display: block; }
  #doom.big .head { font-size: calc(var(--bw) * 0.062); line-height: 1.4; color: #fff; text-shadow: 0 0 .3em rgba(255,46,136,.6); letter-spacing: .04em; }
  #doom.end { top: 34%; }
  #doom.end .head { font-size: calc(var(--bw) * 0.06); color: #fff; -webkit-text-stroke: .06em var(--mag); paint-order: stroke fill; text-shadow: none; margin-bottom: .5em; letter-spacing: .3em; }
  #doom .ln { font-size: calc(var(--bw) * 0.026); line-height: 1.9; }
  #credit { position: absolute; left: 2%; right: 2%; bottom: 2%; text-align: center; font-size: calc(var(--bw) * 0.0135); line-height: 1.5; opacity: .75; display: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 13%; text-align: center; font-size: calc(var(--bw) * 0.02); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,60%,100% { opacity: .9; } 80% { opacity: .3; } }
  #rotate { display: none; }
  @media (orientation: portrait) {
    #rotate { display: block; position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center; font-size: 15px; opacity: .9; color: #e8f0ff;
      font-family: 'DotGothic16', sans-serif; pointer-events: none; }
  }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180"></canvas>
<div id="ui">
  <div id="debug"></div>
  <div id="scene-name"></div>
  <div id="mono"></div>
  <div id="recall"></div>
  <div id="shout"></div>
  <div id="combo"></div>
  <div id="judge"></div>
  <div id="meter"><b>SPEED</b><i></i></div>
  <div id="ending"><div class="rank" id="end-rank"></div><div class="big" id="end-line"></div><div class="small" id="end-stats"></div><div class="small" id="end-again"></div></div>
  <div id="doom"></div>
  <div id="hint"></div>
  <div id="credit">Music: Funeral March for Queen Mary (H. Purcell) – Bablung Music, CC BY 3.0 https://creativecommons.org/licenses/by/3.0/ （Wikimedia Commons より。トリミング・音量調整あり）<br>Music: US Marine Band, Pro Musica Symphony ほか（PD）／ SFX: OpenGameArt ほか（CC0）</div>
</div>
<div id="rotate">横向きにすると大きく遊べます</div>
<!-- クラシック script（ES modules 不使用）。読み込み順固定:
     データ → core/input → 音(audio_engine: 録音MP3を WebAudio で再生) → 疾走の判定(slash_engine) → 絵(共通 → R1〜R3 → 障害物) → ui → scenes → main
     音は fetch で読むのでローカルサーバ / GitHub Pages で開くこと（file:// では無音） -->
<script src="data/texts.js"></script>
<script src="data/rounds.js"></script>
<script src="src/core.js"></script>
<script src="src/input.js"></script>
<script src="src/audio_engine.js"></script>
<script src="src/slash_engine.js"></script>
<script src="src/art_common.js"></script>
<script src="src/art_r1.js"></script>
<script src="src/art_r2.js"></script>
<script src="src/art_r3.js"></script>
<script src="src/art_obstacles.js"></script>
<script src="src/ui.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body>
</html>
