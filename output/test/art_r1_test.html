<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>art_r1 テスト</title>
<style>
  body { margin: 0; padding: 16px; background: #0a0b1e; color: #e8f0ff; font-family: sans-serif; }
  h2 { font-size: 14px; margin: 18px 0 6px; font-weight: normal; }
  canvas { display: block; width: 100%; max-width: 960px; image-rendering: pixelated; background: #000; }
  label { font-size: 13px; }
</style>
</head>
<body>
<h2>A. 夜道（3層パララックス）＋主人公 walk ＋ ハクチョウ襲来（4秒ループ）</h2>
<canvas id="night" width="320" height="180"></canvas>
<h2>E. アルルの夜道（4層）＋主人公 run
  <label>speed01 <input id="sp" type="range" min="0" max="1" step="0.01" value="0.3"> <span id="spv">0.30</span></label></h2>
<canvas id="arles" width="320" height="180"></canvas>
<h2>スプライト一覧（walk×4 / run×4 / ハクチョウ 2コマ / 拡大版 2コマ）</h2>
<canvas id="sheet" width="320" height="110"></canvas>
<script src="../src/art_common.js"></script>
<script src="../src/art_r1.js"></script>
<script>
  var r1 = AT.ART.r1, px = AT.px, G = r1.GROUND_Y;
  function ctx(id) { var c = document.getElementById(id).getContext('2d'); c.imageSmoothingEnabled = false; return c; }
  var cn = ctx('night'), ca = ctx('arles'), cs = ctx('sheet');
  var sp = document.getElementById('sp'), spv = document.getElementById('spv');
  var t0 = performance.now(), dist = 0, last = t0;
  function frame(now) {
    var t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
    var s = +sp.value; spv.textContent = s.toFixed(2);
    // 夜道
    var walkX = t * 30;
    r1.drawNight(cn, walkX, t);
    px.hero.draw(cn, 80, G, 'walk', t, 0);
    var p = (t % 4) / 4;
    r1.drawSwanAttack(cn, p, t, 92, G - 16);
    // アルル
    dist += dt * (60 + 340 * s);
    r1.drawArles(ca, dist, t, s);
    px.hero.draw(ca, 80, G, 'run', t, s);
    // スプライト
    cs.fillStyle = '#1b2350'; cs.fillRect(0, 0, 320, 110);
    for (var f = 0; f < 4; f++) {
      cs.drawImage(px.hero.walk[f], 4 + f * 28, 4);
      cs.drawImage(px.hero.run[f], 4 + f * 28, 32);
    }
    cs.drawImage(r1.cache.swan[0], 4, 62); cs.drawImage(r1.cache.swan[1], 40, 62);
    cs.drawImage(r1.cache.swanBig[0], 130, 4); cs.drawImage(r1.cache.swanBig[1], 200, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
