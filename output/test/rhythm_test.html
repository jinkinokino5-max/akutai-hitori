<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リズム判定テスト</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a0b1e; color: #e8f0ff; font: 14px/1.5 system-ui, sans-serif; padding: 12px 16px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  button { background: #1b2350; color: #e8f0ff; border: 1px solid #3a4a8a; padding: 6px 10px; border-radius: 4px; font: inherit; cursor: pointer; }
  button:hover { border-color: #ff2e88; }
  canvas { width: 100%; max-width: 960px; image-rendering: pixelated; background: #05060f; display: block; touch-action: none; }
  #judge { font-size: 28px; font-weight: bold; height: 36px; }
  .perfect { color: #f5d33a; } .good { color: #3dff8a; } .miss { color: #ff2e88; }
  pre { background: #05060f; padding: 8px; max-width: 960px; overflow: auto; font-size: 12px; }
  small { color: #8a94c0; }
</style>
</head>
<body>
<h1>リズム判定テスト（audio_engine.js + rhythm_engine.js）</h1>
<div class="row">
  <button id="bClick">クリック音で開始</button>
  <button id="bSynth">デモ曲(シンセ)で開始</button>
  <button id="bSong">AT.SONGS の曲で開始</button>
  <button id="bStop">停止</button>
  <button id="bMuff">こもる ON/OFF</button>
  <label>遅延補正 <input id="lat" type="range" min="0" max="200" value="0"> <span id="latv">auto</span>ms</label>
</div>
<div class="row"><small>開始後: どのキー / 下の画面タップで1打。ノーツが白線に重なる瞬間（＝クリック音）に叩く。PERFECT ±50ms / GOOD ±110ms。</small></div>
<canvas id="cv" width="320" height="90"></canvas>
<div id="judge"></div>
<pre id="info">未開始</pre>

<script src="../src/audio_engine.js"></script>
<script src="../src/rhythm_engine.js"></script>
<script>
// 他担当の songs が読めれば使う（なくても動く）
(function () { var s = document.createElement('script'); s.src = '../src/songs.js'; document.head.appendChild(s); })();

// テスト専用のデモ曲（自作の分散和音。実在曲ではない）
var DEMO = { id: 'demo', title: 'demo', bpmBase: 120, bpmMax: 150, beatsPerBar: 4, loop: true, bars: [
  { melody: 'C5:0.5 E5:0.5 G5:0.5 E5:0.5 C6:1 G5:1', chord: ['C3', 'E3', 'G3'], bass: 'C2:1 C2:1 G1:1 G1:1' },
  { melody: 'A4:0.5 C5:0.5 E5:0.5 C5:0.5 A5:1 E5:1', chord: ['A2', 'C3', 'E3'], bass: 'A1:1 A1:1 E1:1 E1:1' },
  { melody: 'F4:0.5 A4:0.5 C5:0.5 A4:0.5 F5:1 C5:1', chord: ['F2', 'A2', 'C3'], bass: 'F1:1 F1:1 C2:1 C2:1', drums: 'K.S.K.S.' },
  { melody: 'G4:0.5 B4:0.5 D5:0.5 G5:0.5 B5:1 r:1', chord: ['G2', 'B2', 'D3'], bass: 'G1:1 G1:1 G1:0.5 A1:0.5 B1:1', drums: 'KHSHKHSY' }
] };

var A = AT.audio, R = AT.rhythm, cv = document.getElementById('cv'), g = cv.getContext('2d');
var muff = false, lastJudge = null, lastJudgeAt = 0, started = false;
console.log('demo song check:', A.validateSong(DEMO));

R.onJudge(function (j) {
  lastJudge = j; lastJudgeAt = performance.now();
  var el = document.getElementById('judge');
  el.className = j.result;
  el.textContent = j.result.toUpperCase() + (j.empty ? '（空打ち）' : '') + (j.diffMs != null ? '  ' + (j.diffMs > 0 ? '+' : '') + j.diffMs + 'ms' : '');
});
R.onReach(function (st) {
  document.getElementById('judge').textContent = '100% 到達！ ' + st.reachTime.toFixed(1) + '秒' + (st.assisted ? '（救済）' : '');
});

function start(music) {
  A.resume();
  R.start({ bpmStart: 120, bpmMax: 150, music: music });
  started = true;
}
document.getElementById('bClick').onclick = function () { start({ type: 'click' }); };
document.getElementById('bSynth').onclick = function () { AT.SONGS = AT.SONGS || {}; AT.SONGS.demo = DEMO; start({ type: 'synth', song: 'demo' }); };
document.getElementById('bSong').onclick = function () {
  var ids = Object.keys(AT.SONGS || {}).filter(function (k) { return k !== 'demo'; });
  if (!ids.length) { alert('AT.SONGS に曲がまだない'); return; }
  var song = AT.SONGS[ids[0]];
  console.log('song', ids[0], 'check:', A.validateSong(song));
  A.resume();
  R.start({ bpmStart: song.bpmBase, bpmMax: song.bpmMax || song.bpmBase, music: { type: 'synth', song: ids[0] } });
  started = true;
};
document.getElementById('bStop').onclick = function () { A.stop(0.2); R.stop(); };
document.getElementById('bMuff').onclick = function () { muff = !muff; A.setMuffled(muff, 0.4); };
document.getElementById('lat').oninput = function (e) {
  A.latency = e.target.value / 1000;
  document.getElementById('latv').textContent = e.target.value;
};
document.querySelectorAll('button,input').forEach(function (b) { b.addEventListener('keydown', function (e) { e.stopPropagation(); }); });

function hit() {
  A.resume();
  if (!R.running) return;
  var j = R.hit();
  if (j) A.sfx(j.result === 'perfect' ? 'perfect' : j.result === 'good' ? 'good' : 'miss');
}
window.addEventListener('keydown', function (e) {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key)) return;
  e.preventDefault(); hit();
});
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); hit(); });

var JX = 60, PX = 32;   // 判定線x, 1拍あたりpx
function draw() {
  R.update();
  g.fillStyle = '#05060f'; g.fillRect(0, 0, 320, 90);
  // 拍線
  var beat = started ? R.getBeat() : 0;
  for (var b = Math.floor(beat) - 2; b < beat + 10; b++) {
    var x = JX + (b - beat) * PX, bar = (b % A.getBeatsPerBar() + A.getBeatsPerBar()) % A.getBeatsPerBar() === 0;
    g.fillStyle = bar ? '#2c1f4a' : '#141838'; g.fillRect(Math.round(x), 20, 1, 50);
  }
  // レーン
  g.fillStyle = '#1b2350'; g.fillRect(0, 38, 320, 14);
  // 判定線
  g.fillStyle = '#e8f0ff'; g.fillRect(JX, 30, 2, 30);
  // ノーツ
  R.getNotes(9, 1).forEach(function (n) {
    var x = Math.round(JX + n.dBeat * PX);
    g.fillStyle = n.state === 'pending' ? (n.eighth ? '#ffb347' : '#ff2e88') : n.state === 'perfect' ? '#f5d33a' : n.state === 'good' ? '#3dff8a' : '#444';
    g.fillRect(x - 3, 40, 6, 10);
  });
  // 速度メーター
  g.fillStyle = '#141838'; g.fillRect(8, 78, 304, 6);
  g.fillStyle = R.speed >= 90 ? '#ff2e88' : '#3a6cff'; g.fillRect(8, 78, Math.round(304 * R.speed / 100), 6);
  var st = R.stats();
  document.getElementById('info').textContent =
    'speed ' + R.speed.toFixed(1) + '   combo ' + R.combo + '   bpm(鳴っている) ' + A.getBpm().toFixed(1) + '  bpm(目標) ' + R.bpmTarget.toFixed(1) +
    '\n拍 ' + beat.toFixed(2) + '   経過 ' + R.elapsed().toFixed(1) + 's   遅延補正 ' + (A.getLatency() * 1000).toFixed(0) + 'ms   ' + (R.done ? '到達済み' : R.running ? '判定中' : '停止') +
    '\n成績 ' + (st ? JSON.stringify(st) : '-');
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
