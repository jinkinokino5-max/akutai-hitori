<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>art_r2 単体確認</title>
<style>
  body { margin: 0; background: #05060f; color: #e8f0ff; font: 14px/1.6 sans-serif; padding: 12px; }
  canvas { width: 960px; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; display: block; border: 1px solid #1b2350; }
  .bar { margin: 8px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: #1b2350; color: #e8f0ff; border: 1px solid #3a4470; padding: 4px 10px; cursor: pointer; }
  button.on { background: #ff5a1f; color: #05060f; }
  #info { opacity: .8; white-space: pre; }
</style>
</head>
<body>
<div class="bar" id="modes"></div>
<canvas id="c" width="320" height="180"></canvas>
<div class="bar">
  speed <input id="sp" type="range" min="0" max="100" value="30"> <span id="spv">30</span>
  <label><input id="front" type="checkbox" checked> 前景</label>
  <label><input id="hero" type="checkbox" checked> 主人公(art_common)</label>
</div>
<div id="info"></div>
<script src="../src/core.js"></script>
<script src="../src/art_common.js"></script>
<script src="../src/art_r2.js"></script>
<script>
(function () {
  var R2 = AT.ART.r2, cv = document.getElementById('c'), g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  var modes = ['world', 'road', 'approach', 'sprites'], mode = 'world', scroll = 0, t0 = performance.now(), last = t0, at = 0;
  var bar = document.getElementById('modes');
  modes.forEach(function (m) {
    var b = document.createElement('button'); b.textContent = m; b.onclick = function () { mode = m; at = 0; sync(); };
    b.id = 'm_' + m; bar.appendChild(b);
  });
  function sync() { modes.forEach(function (m) { document.getElementById('m_' + m).className = m === mode ? 'on' : ''; }); }
  sync();
  var sp = document.getElementById('sp'); sp.oninput = function () { document.getElementById('spv').textContent = sp.value; };
  R2.preload();
  document.getElementById('info').textContent =
    'AT.px.make: ' + (AT.px && AT.px.make ? 'art_common を使用' : '自前ヘルパー') +
    '\n騎馬武者 通常 ' + R2.enemySize.w + 'x' + R2.enemySize.h + ' / 拡大 ' + R2.enemySize.bigW + 'x' + R2.enemySize.bigH + ' / ' + R2.frames + 'コマ' +
    '\n差し色 ' + R2.accent + '   groundY ' + R2.groundY;

  function hero(x, m, t, s01) {
    if (document.getElementById('hero').checked && AT.px && AT.px.hero) AT.px.hero.draw(g, x, R2.groundY, m, t, s01);
  }
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    var t = (now - t0) / 1000, s = +sp.value, front = document.getElementById('front').checked;
    if (mode === 'world') {
      scroll += dt * (60 + s * 3);
      R2.drawWorld(g, scroll, t, s);
      hero(80, 'run', t, s / 100);
      if (front) R2.drawWorldFront(g, scroll, t, s);
    } else if (mode === 'road') {
      scroll += dt * 40;
      R2.drawRoad(g, scroll, t);
      hero(80, 'walk', t, 0.3);
      if (front) R2.drawRoadFront(g, scroll, t);
    } else if (mode === 'approach') {
      at += dt; var p = (at % 4.5) / 4;   // 4秒で迫り、0.5秒止める
      scroll += dt * 40;
      R2.drawRoad(g, scroll, t);
      hero(80, 'walk', t, 0.3);
      R2.drawApproach(g, Math.min(1, p), t, 92, R2.groundY);
    } else {
      g.fillStyle = '#1b2350'; g.fillRect(0, 0, 320, 180);
      g.fillStyle = '#0a0b1e'; g.fillRect(0, 60, 320, 120);
      for (var f = 0; f < R2.frames; f++) R2.drawEnemy(g, 36 + f * 64, 56, t, { frame: f });
      R2.drawEnemy(g, 70, 176, t, { big: true });
      R2.drawEnemy(g, 200, 176, t, { big: true, frame: 0 });
      R2.drawEnemy(g, 290, 120, t);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
